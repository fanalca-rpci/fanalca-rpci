# Publica lo que se cambia en la administración web (🌐 Sitio y enlaces por TAG):
# títulos, color, logo, Excel de fichas. Cada 15 min revisa si hay cambios en
# Supabase (site_settings.version); si los hay, regenera docs/ y hace push.
name: Publicar cambios de la administración

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar cambios y regenerar
        id: sync
        run: |
          pip install --quiet openpyxl
          python3 site_sync.py | tee /tmp/sync.log
          grep -q '^changed=true' /tmp/sync.log && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Publicar
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs site_config.json plantilla_sitio.xlsx TAG_RESOURCES.xlsx fichas_source.* 2>/dev/null || true
          git add -A docs site_config.json
          if git diff --cached --quiet; then echo "Nada que publicar."; exit 0; fi
          git commit -m "chore: publicar cambios hechos desde la administración web"
          git push
          echo "✅ Publicado."
