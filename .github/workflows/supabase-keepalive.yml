# Evita que Supabase (plan gratis) pause el proyecto por 7 días sin actividad.
# Cada 2 días hace una consulta real a la base con la anon key pública de
# site_config.json (la misma que usa el sitio). Sirve igual en cualquier planta.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 11 */2 * *"   # cada 2 días, 06:17 hora Colombia
  workflow_dispatch: {}        # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site_config.json
          sparse-checkout-cone-mode: false

      - name: Consultar la base
        run: |
          URL=$(jq -r '.supabase.url' site_config.json)
          KEY=$(jq -r '.supabase.anon_key' site_config.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ] || [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "❌ Falta el bloque supabase en site_config.json"; exit 1
          fi
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/r.json -w '%{http_code}' \
              "$URL/rest/v1/equipment_classes?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            if [ "$CODE" = "200" ]; then
              echo "✅ Supabase respondió ($URL) — $(date -u +%FT%TZ)"; exit 0
            fi
            echo "⚠️ Intento $i: HTTP $CODE"; sleep 20
          done
          echo "❌ Supabase no respondió. Revisar si el proyecto quedó pausado en el panel."; cat /tmp/r.json; exit 1
